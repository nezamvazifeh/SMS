<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#142253">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ارسال پیامک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#123047;--teal:#0f766e;--mist:#e9eef2;--line:#cfd9e0;--amber:#ffe08a;--amber-d:#d49a00}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--mist);color:var(--ink)}
.app{max-width:480px;margin:0 auto;min-height:100vh}
.top{background:var(--ink);color:#fff;padding:12px 22px;min-height:52px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 22px 22px;box-shadow:0 6px 18px #12304722}
.top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px;opacity:.92}
.wrench{background:none;border:0;color:#fff;opacity:.7;font-size:15px;padding:6px 8px;cursor:pointer}
main{padding:16px 16px 110px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.6}
.keybox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.keybox button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px;background:var(--ink);color:#fff}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 6px;padding-top:2px}
.chip{position:relative;width:100%;height:34px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 3px;font-size:10.5px;line-height:1.2;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:9px}
.chip.long{font-size:9px}
.chip.fav{background:#fff;border-color:var(--amber-d);font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{position:absolute;top:-7px;right:5px;background:var(--amber-d);color:#fff;font-size:8px;line-height:1;padding:2px 5px;border-radius:5px;font-weight:400}
.phone{background:#d5dee5;border-radius:18px;padding:12px;margin-top:18px}
.bubble{background:#fff;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14px;line-height:1.85}
.f{background:var(--amber);border:0;border-bottom:1.5px solid var(--amber-d);border-radius:4px;padding:0 4px;margin:0;height:auto;font:inherit;font-size:12.5px;line-height:1.3;color:var(--ink);text-align:center;outline:none;display:inline-block;vertical-align:baseline;min-width:26px;box-shadow:none}
.f.meas{position:fixed;visibility:hidden;pointer-events:none;white-space:pre;left:0;top:0;width:auto}
.f::placeholder{color:#8a6a00;opacity:.75}
.f.bad{background:#fecaca;border-bottom-color:#dc2626}
.f:focus{background:#ffd24d}
.hint{font-size:11.5px;color:#5b7183;margin-top:8px}
.msg{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
.ok{background:#d9f2ec;color:#0b5b53}.err{background:#fde2e2;color:#9b1c1c}
.hide{display:none}
body.editing main{padding-bottom:70vh}
body.editing .bar{display:none}
body.editing .phone{position:sticky;top:8px;z-index:6;box-shadow:0 8px 22px #12304733}
.tools{display:flex;gap:2px}
#hist{margin-top:26px}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:600;font-size:14px}
.hh button{width:auto;margin:0;padding:6px 12px;border:0;border-radius:8px;background:#d5dee5;color:var(--ink);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.bar input{flex:1;max-width:310px;direction:ltr;text-align:right}
#send{padding:0 24px;border:0;border-radius:10px;background:var(--teal);color:#fff;font-weight:600;font-size:16px}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-120px);background:var(--teal);color:#fff;padding:12px 22px;border-radius:12px;font-size:15px;transition:transform .35s;z-index:99}
.toast.show{transform:translate(-50%,0)}
.hi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px;line-height:1.9}
.hi b{font-size:14px}
.tag{display:inline-block;padding:1px 8px;border-radius:8px;font-size:12px}
.tag.ok{background:#d9f2ec;color:#0b5b53}.tag.err{background:#fde2e2;color:#9b1c1c}
.tag.op{background:#dbeafe;color:#1e40af}.tag.wait{background:#fff1c2;color:#7a5600}
.raw{color:#94a3b8;font-size:11px}
.morebtn{display:block;width:100%;margin-top:8px;padding:6px;border:0;border-top:1px dashed var(--line);background:none;color:#5b7183;font-size:12px}
.more-box{overflow:hidden;max-height:0;padding-top:0;transition:max-height .3s ease,padding .3s ease}
.more-box.open{max-height:320px;padding-top:10px}
.re{width:auto;margin-top:6px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:12px}

/* ===== انیمیشن‌ها ===== */
@keyframes dropIn{from{transform:translateY(-110%);opacity:0}to{transform:none;opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes barIn{from{transform:translateY(110%)}to{transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.55) translateY(8px)}60%{opacity:1;transform:scale(1.07)}100%{opacity:1;transform:none}}
@keyframes selPop{0%{transform:scale(.9)}50%{transform:scale(1.09)}100%{transform:scale(1)}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(12px) scale(.97);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes fieldIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes sheen{from{transform:translateX(-150%)}to{transform:translateX(330%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rip{to{transform:scale(2.8);opacity:0}}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 #d49a0055}50%{box-shadow:0 0 0 5px #d49a0000}}
@keyframes confetti{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.top{position:relative;overflow:hidden;animation:dropIn .7s cubic-bezier(.2,.85,.25,1) both}
.top::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(100deg,transparent,#ffffff18,transparent);animation:sheen 6s ease-in-out 1.5s infinite;pointer-events:none}
.wrench{transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.wrench:active{transform:rotate(28deg) scale(.85);opacity:1}
.chip{overflow:hidden;transition:transform .18s,background .3s,color .3s,border-color .3s,box-shadow .3s}
.chip:active{transform:scale(.93)}
.chip.fav:not(.on){box-shadow:0 2px 8px #d49a0022}
.chip.on{animation:selPop .38s cubic-bezier(.3,1.4,.5,1);box-shadow:0 4px 14px #12304744}
.chip.enter{animation:popIn .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*38ms + 280ms)}
.chip.pop{animation:popIn .42s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0ms)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
.morebtn{transition:color .2s,letter-spacing .3s}.morebtn:active{letter-spacing:1px;color:var(--ink)}
.phone{animation:riseIn .65s .4s cubic-bezier(.2,.8,.2,1) both}
.bubble.swap{animation:bubbleIn .5s cubic-bezier(.2,.8,.2,1)}
.bubble.swap .f{animation:fieldIn .45s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--k)*70ms + 140ms)}
.f{transition:width .22s cubic-bezier(.3,1.2,.5,1),background .25s,box-shadow .25s,border-color .25s}
.f:focus{box-shadow:0 0 0 3px #d49a0050;border-bottom-color:#b07d00}
.f.bad{box-shadow:0 0 0 3px #dc262633}
.bar{animation:barIn .7s .55s cubic-bezier(.2,.85,.25,1) both}
.bar input{transition:box-shadow .25s,border-color .25s}.bar input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f766e30;outline:none}
#send{position:relative;overflow:hidden;transition:transform .15s,box-shadow .25s;box-shadow:0 6px 16px #0f766e44}
#send:active{transform:scale(.94)}
#send.busy{color:transparent;pointer-events:none}
#send.busy::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border:2.5px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .65s linear infinite}
.keybox{animation:riseIn .4s cubic-bezier(.2,.8,.2,1) both}
.toast{transition:transform .55s cubic-bezier(.2,1.4,.4,1);padding-bottom:16px;overflow:hidden}
.toast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff88;transform-origin:right;transform:scaleX(0)}
.toast.show::after{animation:tbar 3.5s linear forwards}
.msg{transition:opacity .3s}
#hist.anim{animation:riseIn .5s cubic-bezier(.2,.8,.2,1)}
#hist.anim .hi{animation:riseIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*55ms + 100ms)}
.tag.wait{animation:ring 1.8s ease-in-out infinite}
.re,.hh button{transition:transform .15s}.re:active,.hh button:active{transform:scale(.92)}
.cf{position:fixed;width:7px;height:11px;border-radius:2px;pointer-events:none;z-index:120;animation:confetti .95s cubic-bezier(.15,.7,.3,1) forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== تم مدرن (روشن و تیره) ===== */
:root{--g1:#3a5bff;--g2:#12b5c9;--grad:linear-gradient(135deg,var(--g1),var(--g2))}
html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{background:radial-gradient(70% 40% at 100% 0%,#c9d6ff90,transparent 70%),radial-gradient(60% 35% at 0% 28%,#bff3ea90,transparent 70%),#f3f6fc;background-attachment:fixed;color:#14203f}
.top{background:linear-gradient(135deg,#142253,#2a4bb0)}
.chip{background:#ffffffcc;border-color:#d5ddf0}
.chip.fav:not(.on){border-color:#e8b24a;background:#fffaf0}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 6px 18px #3a5bff44}
.phone{background:#ffffff8c;border:1px solid #ffffffcc;box-shadow:0 12px 32px #2a4bb01c}
.bubble{background:var(--grad);color:#fff;border-radius:20px 20px 20px 5px;box-shadow:0 8px 20px #3a5bff33}
.f{background:#ffe9a8;color:#3a2a00;border-bottom-color:#e0a21a}
.f::placeholder{color:#8a6200;opacity:.75}
.hint{color:#6b7a99}
.bar{background:#ffffffe8;backdrop-filter:blur(14px)}
#send{background:var(--grad);color:#fff;box-shadow:0 8px 20px #3a5bff44}
.toast{background:var(--grad)}
input{border-color:#d5ddf0}

html[data-theme=dark] body{background:radial-gradient(60% 40% at 92% -5%,#3a4fe05a,transparent 70%),radial-gradient(50% 35% at 0% 36%,#12b8a238,transparent 70%),#080d1c;background-attachment:fixed;color:#e9eefb}
[data-theme=dark] .top{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.1);box-shadow:none}
[data-theme=dark] .chip{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:#e9eefb}

[data-theme=dark] .chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 20px #3a5bff66}
[data-theme=dark] .phone{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:none}
[data-theme=dark] .bubble{box-shadow:0 10px 28px #3a5bff40}
[data-theme=dark] input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#e9eefb}

[data-theme=dark] .f.bad{background:#ff9a9a;color:#3a0000}

[data-theme=dark] .keybox{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}

[data-theme=dark] .hi{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);color:#e9eefb}
[data-theme=dark] .re{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#e9eefb}
[data-theme=dark] .hh{color:#e9eefb}
[data-theme=dark] .hh button{background:rgba(255,255,255,.1);color:#e9eefb}

.quota{margin-inline-start:auto;margin-inline-end:10px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.13);font-size:11.5px;animation:popIn .4s both}
.quota.low{background:#ffd98a33;color:#ffd98a}
.quota.zero{background:#ff6b6b33;color:#ff9f9f}
/* ===== زمینه استخوانی ===== */
html[data-theme=light] body{background:radial-gradient(70% 40% at 100% 0%,#fbf5e6cc,transparent 70%),radial-gradient(60% 35% at 0% 30%,#e6dcc4aa,transparent 70%),#eee7d7;background-attachment:fixed;color:#2d2b26}

[data-theme=light] .bar{background:#f6f1e6ee}

/* ===== اخطار شیشه‌ای ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes wob{0%{transform:scale(.4) rotate(-20deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:none}}
.gl-wrap{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(40,32,15,.3);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fadeIn .25s both}
.gl-wrap.out{opacity:0;transition:opacity .2s}
.gl{width:min(88vw,340px);padding:24px 20px 18px;border-radius:26px;text-align:center;color:#1d2a4d;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.46));border:1px solid rgba(255,255,255,.8);box-shadow:0 24px 60px rgba(40,32,15,.3),inset 0 1px 0 rgba(255,255,255,.95);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);animation:popIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.gl-i{font-size:42px;animation:wob .6s .15s both}
.gl b{display:block;font-size:16px;margin:6px 0 4px}
.gl p{margin:0 0 16px;font-size:14px;line-height:1.9;color:#33405f}
.gl button{width:100%;margin:0;padding:11px;border:0;border-radius:14px;background:var(--grad);color:#fff;font-weight:600;font-size:15px}
</style>

<body>
<div class="toast" id="toast"></div>
<div class="app">
  <header class="top"><h1>ارسال پیامک</h1><span class="quota hide" id="quota"></span><div class="tools"><button class="wrench" id="histBtn" title="تاریخچه">🕘</button><button class="wrench" id="wrench" title="تنظیمات">🔧</button></div></header>
  <main>
    <div class="keybox hide" id="keyBox">
      <input id="key" type="password" dir="ltr" placeholder="رمز شخصی">
      <button id="saveKey">ذخیره</button>
    </div>
    <div class="chips" id="chips"></div>
    <button class="morebtn" id="moreBtn"></button>
    <div class="chips more-box" id="chipsMore"></div>
    <section class="phone">
      <div class="bubble" id="sms"></div>
      <div class="hint">روی بخش‌های زرد بزن و مقدار را بنویس</div>
    </section>
    <div class="msg" id="out"></div>
    <div class="hide" id="hist"></div>
  </main>
  <footer class="bar">
    <input id="mobile" inputmode="numeric" placeholder="09123456789">
    <button id="send">ارسال</button>
  </footer>
</div>

<script>

const tokenVal=()=>norm($("key").value).replace(/[^\x21-\x7E]/g,"");

// ===== قالب‌ها: [کد، عنوان، متن، ویژه] — هر {NAME} یک کادر قابل ویرایش است =====
const P="متقاضی گرامی {GENDER} {NAME} با کد ملی {NATIONALID} ";
const ALL=[
 // ویژه‌ها (به ترتیب)
 ["955721","گواهینامه ارجاع",P+"گواهینامه به شماره {CODE|شماره} با شناسه {ID} به واحد بررسی ارجاع داده شد.\nواحد {UNIT}",1],

 ["210603","گواهینامه",P+"گواهینامه به شماره {CODE|شماره} با شناسه {ID} ثبت گردید.\nواحد {UNIT}",1],
 ["187027","شهریه دانشجو","دانشجوی گرامی،\nبا توجه به بسته‌شدن پرتال آموزشی، خواهشمند است نسبت به تسویه بدهی شهریه خود در اسرع وقت اقدام فرمایید.\nواحد {UNI}",1],

let sel=Math.max(0,T.findIndex(t=>t.code===ls.g("sms_selc","")));
function moreLabel(){const m=$("chipsMore");$("moreBtn").textContent=m.classList.contains("open")?"کمتر ▴":"بیشتر ("+T.filter(t=>!t.fav).length+") ▾";}
let intro=true;
function markSel(){document.querySelectorAll(".chip").forEach(el=>el.classList.toggle("on",+el.dataset.i===sel));}
function ripple(el,e){const b=el.getBoundingClientRect(),d=Math.max(b.width,b.height),r=document.createElement("span");r.className="rip";
  r.style.cssText="width:"+d+"px;height:"+d+"px;left:"+((e&&e.clientX||b.left+b.width/2)-b.left-d/2)+"px;top:"+((e&&e.clientY||b.top+b.height/2)-b.top-d/2)+"px";el.appendChild(r);setTimeout(()=>r.remove(),700);}
function shake(el){try{el.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(-4px)"},{transform:"translateX(0)"}],{duration:380,easing:"ease-in-out"})}catch(e){}}
function renderChips(){
  const a=$("chips"),m=$("chipsMore");a.innerHTML="";m.innerHTML="";
  T.forEach((t,i)=>{
    const b=document.createElement("button");b.className="chip"+(i===sel?" on":"")+(intro?" enter":"");b.dataset.i=i;b.style.setProperty("--i",i);b.textContent=t.title;
    if(t.fav)b.classList.add("fav");if(t.title.length>12)b.classList.add("long");
    b.onclick=e=>{ripple(b,e);sel=i;ls.s("sms_selc",t.code);markSel();renderText();};
    (t.fav?a:m).appendChild(b);
  });
  if(!T[sel].fav)m.classList.add("open");
  moreLabel();intro=false;
}
$("moreBtn").onclick=()=>{const m=$("chipsMore");m.classList.toggle("open");moreLabel();
  if(m.classList.contains("open"))m.querySelectorAll(".chip").forEach((c,k)=>{c.style.setProperty("--d",k*32+"ms");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");});};
const box=$("sms");
const meas=document.createElement("span");meas.className="f meas";document.body.appendChild(meas);
function fit(el){meas.textContent=el.value||el.placeholder;el.style.width=(meas.offsetWidth+10)+"px";}
function renderText(){
  box.innerHTML="";box.classList.remove("swap");void box.offsetWidth;box.classList.add("swap");
  T[sel].text.split(/(\{[A-Za-z0-9_]+(?:\|[^}]*)?\})/).forEach(p=>{
    const m=p.match(/^\{([A-Za-z0-9_]+)(?:\|([^}]*))?\}$/);
    if(m){
      const s=document.createElement("input");s.type="text";s.className="f";
      s.dataset.n=m[1];s.style.setProperty("--k",box.querySelectorAll(".f").length);s.placeholder=m[2]||LABELS[m[1]]||m[1];
      s.autocomplete="off";s.autocapitalize="none";s.spellcheck=false;
      s.oninput=()=>{s.classList.remove("bad");fit(s);};
      s.onfocus=()=>{if(!document.body.classList.contains("editing")){prevY=window.scrollY;kbOpen=false;}document.body.classList.add("editing");[60,300,650].forEach(d=>setTimeout(up,d));};
      s.onblur=()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&a.classList&&a.classList.contains("f")))restore();},60);
      s.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const all=[...box.querySelectorAll(".f")],k=all.indexOf(s);if(all[k+1])all[k+1].focus();else s.blur();}};
      if(m[1]==="NATIONALID")s.addEventListener("blur",()=>{if(s.value.trim()&&!validNID(s.value))s.classList.add("bad");});
      if(m[1]==="UNIT"||m[1]==="UNI")s.value="مرکز";
      else if(m[1]==="ID"||/شناسه/.test(s.placeholder))s.value=String(100000+Math.floor(Math.random()*900000)).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
      box.appendChild(s);fit(s);
    }else p.split("\n").forEach((l,i)=>{if(i)box.appendChild(document.createElement("br"));box.appendChild(document.createTextNode(l));});
  });
}
renderChips();renderText();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>box.querySelectorAll(".f").forEach(fit));

// وقتی روی کادر زرد می‌زنی، متن پیامک بالای صفحه می‌آید تا زیر کیبورد نرود
function up(){const el=document.querySelector(".phone");if(!el||!document.body.classList.contains("editing"))return;window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+window.scrollY-10));}
let prevY=0;
const baseH=window.visualViewport?window.visualViewport.height:window.innerHeight;
// بعد از بسته شدن کیبورد، صفحه به جای قبلی برمی‌گردد
function restore(){document.body.classList.remove("editing");requestAnimationFrame(()=>window.scrollTo({top:prevY,behavior:"auto"}));}
let kbOpen=false,kbT;
if(window.visualViewport)window.visualViewport.addEventListener("resize",()=>{
  if(!document.body.classList.contains("editing"))return;
  const h=window.visualViewport.height;
  if(h<baseH*0.8){kbOpen=true;clearTimeout(kbT);setTimeout(up,60);}
  else if(kbOpen&&h>baseH*0.92){clearTimeout(kbT);kbT=setTimeout(()=>{if(window.visualViewport.height>baseH*0.92){kbOpen=false;const a=document.activeElement;if(a&&a.blur)a.blur();}},90);}
});

function showQuota(d){
  const q=$("quota");
  if(d&&d.admin){q.textContent="مدیر · نامحدود";q.className="quota";return;}
  if(!d||d.remaining==null){q.className="quota hide";return;}
  q.textContent="اعتبار شما "+Number(d.remaining).toLocaleString("fa-IR")+" عدد";q.className="quota"+(d.remaining<=0?" zero":d.remaining<=2?" low":"");
}
async function loadMe(){
  const key=tokenVal();if(!key||WORKER.includes("YOUR-WORKER"))return;
  try{
    const r=await fetch(WORKER+"/me",{headers:{"x-app-token":key}}),d=await r.json().catch(()=>null);

function glassAlert(title,text){
  const old=document.querySelector(".gl-wrap");if(old)old.remove();
  const w=document.createElement("div");w.className="gl-wrap";
  const g=document.createElement("div");g.className="gl";
  const i=document.createElement("div");i.className="gl-i";i.textContent="⚠️";
  const h=document.createElement("b");h.textContent=title;
  const p=document.createElement("p");p.textContent=text;
  const b=document.createElement("button");b.textContent="باشه";
  b.onclick=()=>{w.classList.add("out");setTimeout(()=>w.remove(),220);};
  w.onclick=e=>{if(e.target===w)b.onclick();};
  g.appendChild(i);g.appendChild(h);g.appendChild(p);g.appendChild(b);w.appendChild(g);document.body.appendChild(w);
  try{navigator.vibrate&&navigator.vibrate([20,40,20])}catch(e){}

let pend=null;
const NUMCODE=new Set(["955721","210603"]);
function burst(){const r=$("send").getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,cols=["#ffd98a","#3dd9c0","#6d8bff","#ffffff","#f0a93a"];

    p.style.cssText="left:"+x+"px;top:"+y+"px;background:"+cols[i%5]+";--dx:"+Math.cos(a)*d+"px;--dy:"+(Math.sin(a)*d-45)+"px;--rot:"+(Math.random()*720-360)+"deg";
    document.body.appendChild(p);setTimeout(()=>p.remove(),1000);}
  try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}}

// ===== ارسال =====
$("send").onclick=async()=>{
  const key=tokenVal(),t=T[sel],mobile=norm($("mobile").value);
  if(WORKER.includes("YOUR-WORKER"))return msg("آدرس Worker هنوز داخل فایل تنظیم نشده","err");
  if(!key){$("keyBox").classList.remove("hide");return msg("رمز شخصی را از علامت 🔧 بالای صفحه وارد کن","err");}
  if(!/^09\d{9}$/.test(mobile)){shake($("mobile"));return msg("شماره موبایل معتبر نیست","err");}
  const spans=[...box.querySelectorAll(".f")];
  const empty=spans.filter(x=>!x.value.trim());
  if(empty.length){empty.forEach(x=>{x.classList.add("bad");shake(x);});return msg("بخش‌های قرمز را پر کن","err");}
  if(NUMCODE.has(t.code)){const c=spans.find(x=>x.dataset.n==="CODE");
    if(c&&!/^\d+$/.test(norm(c.value))){c.classList.add("bad");shake(c);return glassAlert("فقط عدد بنویسید","در کادر «شماره» فقط عدد بنویسید؛ حروف و متن مجاز نیست.");}}
  const parameters=spans.map(s=>({name:s.dataset.n,value:s.value.trim()}));
  const np=parameters.find(p=>p.name==="NAME")||parameters[0]||{value:""};
  const saved=parameters.map(p=>({n:p.name,v:p.value}));
  const nidF=spans.find(x=>x.dataset.n==="NATIONALID");
  if(nidF&&!validNID(nidF.value)){nidF.classList.add("bad");if(!confirm("کد ملی معتبر به نظر نمی‌رسد. به‌هر حال ارسال شود؟"))return;}
  const dup=loadH().find(x=>x.code===t.code&&x.mobile===mobile&&Date.now()-x.t<60000);
  if(dup&&!confirm("همین قالب تا یک دقیقه پیش به همین شماره ارسال شده. دوباره ارسال شود؟"))return;
  // در قالب‌های sms.ir جنسیت بعد از نام می‌آید؛ برای نمایش «آقای نام» مقدارها جابه‌جا فرستاده می‌شوند
  if(parameters.some(p=>p.name==="GENDER")&&parameters.some(p=>p.name==="NAME"))
    parameters.forEach(p=>{if(p.name==="GENDER")p.name="NAME";else if(p.name==="NAME")p.name="GENDER";});
  $("send").disabled=true;$("send").classList.add("busy");msg("در حال ارسال...","ok");
  // هر ارسال یک شناسه یکتا دارد؛ اگر اتصال قطع شد و دوباره امتحان شود، پیامک دوبار نمی‌رود
  const sig=JSON.stringify([t.code,mobile,parameters]);
  if(!pend||pend.sig!==sig||Date.now()-pend.t>120000)pend={sig,t:Date.now(),rid:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2))};
  try{
    let r,d,att=0;
    for(;;){
      try{
        r=await fetch(API_URL,{method:"POST",
          headers:{"Content-Type":"application/json","Accept":"application/json","x-app-token":key},
          body:JSON.stringify({mobile,templateId:Number(t.code),parameters,rid:pend.rid}),
          signal:(typeof AbortSignal.timeout==="function")?AbortSignal.timeout(25000):undefined});
        d=await r.json().catch(()=>({}));
        if(r.status>=500&&att<2){att++;msg("اتصال ناپایدار؛ تلاش دوباره ("+att+" از ۲)...","ok");await new Promise(z=>setTimeout(z,1400*att));continue;}
        break;
      }catch(e){
        if(att<2){att++;msg("اتصال ناپایدار؛ تلاش دوباره ("+att+" از ۲)...","ok");await new Promise(z=>setTimeout(z,1400*att));continue;}
        throw e;
      }
    }
    if(r.ok&&d.status===1){pend=null;
      $("out").style.display="none";toast("✅ پیامک ارسال شد");burst();if(d._remaining!=null)showQuota({remaining:d._remaining});
      const h=loadH();h.unshift({id:d.data&&d.data.messageId,mobile,name:np.value,tpl:t.title,code:t.code,vals:saved,t:Date.now(),s:null});
      saveH(h);if(!$("hist").classList.contains("hide"))renderH();
      $("mobile").value="";
      try{box.animate([{transform:"none",opacity:1},{transform:"translateY(-70px) scale(.94)",opacity:0}],{duration:420,easing:"cubic-bezier(.5,0,.8,.4)"}).finished.then(renderText,renderText);}catch(e){renderText();}
    }else{msg("❌ خطا: "+(d.message||r.status),"err");
      if([400,402,403].includes(r.status)&&d.message)glassAlert("پیامک ارسال نشد",d.message);
      else if(r.status>=500)glassAlert("ارتباط ناپایدار است","جواب نیامد. لطفاً دوباره «ارسال» را بزنید؛ پیامک دوبار نمی‌رود.");}
  }catch(e){msg("❌ ارتباط قطع شد؛ دوباره «ارسال» را بزنید","err");glassAlert("ارتباط قطع شد","یک لحظه اینترنت یا سرور جواب نداد. لطفاً دوباره «ارسال» را بزنید؛ پیامک دوبار نمی‌رود.");}
  $("send").disabled=false;$("send").classList.remove("busy");
};

// ===== تاریخچه =====
const HK="sms_hist";
function loadH(){try{return JSON.parse(ls.g(HK,"[]"))}catch(e){return[]}}
function saveH(h){ls.s(HK,JSON.stringify(h.slice(0,50)));}
// کد وضعیت sms.ir: 1 رسیده | 2 نرسیده | 3 و 4 اپراتور | بقیه در انتظار
function info(s){
  if(s===1)return["✅ رسیده به گوشی","ok"];
  if(s===2)return["❌ نرسیده","err"];
  if(s===3||s===4)return["📡 در اختیار اپراتور","op"];
  return["⏳ در انتظار تایید","wait"];
}
function renderH(){
  const b=$("hist"),h=loadH();b.innerHTML="";
  const hh=document.createElement("div");hh.className="hh";
  const ti=document.createElement("span");ti.textContent="تاریخچه ارسال‌ها";hh.appendChild(ti);
  const rb=document.createElement("button");rb.textContent="🔄 بروزرسانی";rb.onclick=refreshH;
  const cb=document.createElement("button");cb.textContent="🗑 پاک کردن";
  cb.onclick=()=>{if(confirm("تاریخچه ارسال‌ها پاک شود؟")){saveH([]);renderH();toast("تاریخچه پاک شد");}};
  const grp=document.createElement("div");grp.style.cssText="display:flex;gap:6px";grp.appendChild(rb);grp.appendChild(cb);hh.appendChild(grp);
  b.appendChild(hh);
  if(!h.length){const e=document.createElement("div");e.className="hint";e.textContent="هنوز پیامکی ارسال نشده";b.appendChild(e);return;}
  h.forEach((x,k)=>{
    const [txt,cls]=info(x.s),d=document.createElement("div");d.className="hi";d.style.setProperty("--k",k);
    const bb=document.createElement("b");bb.textContent=(x.name||"-")+" — "+x.mobile;d.appendChild(bb);
    d.appendChild(document.createElement("br"));
    const tag=document.createElement("span");tag.className="tag "+cls;tag.textContent=txt;d.appendChild(tag);
    const r=document.createElement("span");r.className="raw";r.textContent=" کد وضعیت: "+(x.s==null?"-":x.s);d.appendChild(r);
    d.appendChild(document.createElement("br"));
    d.appendChild(document.createTextNode((x.tpl?x.tpl+" • ":"")+new Date(x.t).toLocaleString("fa-IR")));
    if(x.vals&&x.code){d.appendChild(document.createElement("br"));const re=document.createElement("button");re.className="re";re.textContent="🔁 ارسال دوباره";re.onclick=()=>resend(x);d.appendChild(re);}
    b.appendChild(d);
  });
}
function resend(x){
  const i=T.findIndex(t=>t.code===x.code);if(i<0)return toast("قالب پیدا نشد");
  sel=i;ls.s("sms_selc",x.code);renderChips();renderText();
  box.querySelectorAll(".f").forEach(f=>{const v=(x.vals||[]).find(p=>p.n===f.dataset.n);if(v){f.value=v.v;fit(f);}});
  $("hist").classList.add("hide");$("mobile").value="";window.scrollTo({top:0});
  toast("🔁 آماده ارسال؛ شماره را بنویس");$("mobile").focus();
}
async function refreshH(){
  const key=tokenVal();if(!key)return toast("اول رمز شخصی را از 🔧 وارد کن");
  const h=loadH();
  for(const x of h){
    if(!x.id||x.s===1||x.s===2)continue;
    try{
      const r=await fetch(REPORT_URL+x.id,{headers:{"Accept":"application/json","x-app-token":key}});
      const d=await r.json();
      if(d&&d.data)x.s=(d.data.deliveryState===undefined?null:d.data.deliveryState);
    }catch(e){}
  }
  saveH(h);renderH();
}
$("histBtn").onclick=()=>{
  const b=$("hist");b.classList.toggle("hide");
  if(!b.classList.contains("hide")){b.classList.add("anim");setTimeout(()=>b.classList.remove("anim"),1200);renderH();refreshH();setTimeout(()=>b.scrollIntoView({behavior:"smooth",block:"start"}),60);}
};
loadMe();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
